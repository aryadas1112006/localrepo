<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>
<body bgcolor="lightblue">
<center>
    <font face="Aparajita" size="7" color="blue">
        <b><u>Registration Form</u></b>
    </font>
</center>
<br><br>
<br><br>
<center>
<form method="post" action="https://www.google.com">
<table width="50%">
<tr>
    <td>Full Name :</td>
    <td><input type="text" name="fullname" size="25"></td>
</tr>

<tr>
    <td>Father's Name :</td>
    <td><input type="text" name="fathername" size="25"></td>
</tr>

<tr>
    <td>Address :</td>
    <td><input type="text" name="address" size="25"></td>
</tr>

<tr>
    <td>Caste :</td>
    <td>
        <select name="caste">
            <option>General</option>
            <option>OBC</option>
            <option>SC</option>
            <option>ST</option>
        </select>
    </td>
</tr>

<tr>
    <td>Phone No :</td>
    <td><input type="text" name="phone" size="25"></td>
</tr>

<tr>
    <td colspan="2">
        <center>
            <input type="reset" value="Reset">
            <input type="submit" value="Register">
        </center>
    </td>
</tr>
</table>
</form>
</center>
</body>
</html>
